name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Type-check & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    env:
      # Dummy values that satisfy the Zod env schema so config.ts doesn't
      # throw on import.  Tests that exercise real validation use vi.stubEnv
      # with vi.resetModules() to supply their own values.
      NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: https://irepair.test
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
      STRIPE_SECRET_KEY: sk_test_xxxxxxxxxxxx
      STRIPE_WEBHOOK_SECRET: whsec_test_xxxxxxxxxxxx

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

